[project]
name = "policy-qa-service"
version = "0.1.0"
description = "Grounded RAG API that answers questions from policy docs with citations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "qdrant-client>=1.12",
    "httpx>=0.27",            # calls Ollama's HTTP API
    "pydantic-settings>=2.4", # loads config from env / .env
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Ollama (deselect with -m 'not integration')"]
